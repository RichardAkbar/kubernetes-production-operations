apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: services-lab
spec:
  type: ClusterIP
  selector:
    app: nginx-app
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
  namespace: services-lab
spec:
  type: NodePort
  selector:
    app: nginx-app
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 32446
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-loadbalancer
  namespace: services-lab
spec:
  type: LoadBalancer
  selector:
    app: nginx-app
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
